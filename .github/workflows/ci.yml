name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-rights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Secrets scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.24.3
          # Official gitleaks_8.24.3_linux_x64.tar.gz digest (from the v8.24.3 checksums file).
          GITLEAKS_LINUX_X64_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/gitleaks"
          mkdir -p "$d"
          curl -sSfL --retry 3 -o "$d/gl.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  $d/gl.tgz" | sha256sum -c -
          tar -xzf "$d/gl.tgz" -C "$d" gitleaks
          "$d/gitleaks" detect --source . --no-banner --redact -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Registry join regression checks
        run: node --test scripts/registry-join.test.mjs scripts/native-labels.test.mjs scripts/native-search.test.mjs scripts/search-policy.test.mjs scripts/public-identities.test.mjs scripts/thai-editions.test.mjs scripts/thai-generator.test.mjs
      - name: Rights enforcement (title-only datasets carry titles only)
        run: node scripts/assert-rights.mjs
      - name: Link integrity (every cross-link target resolves)
        run: node scripts/check-counterpart-links.mjs
      - name: Production build (vite-ssg, ~29k pages)
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dist
          path: dist/
          retention-days: 3
