name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-rights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secrets scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rights enforcement (title-only datasets carry titles only)
        run: node scripts/assert-rights.mjs
      - name: Link integrity (every cross-link target resolves)
        run: node scripts/check-counterpart-links.mjs
      - name: Production build (vite-ssg, ~29k pages)
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/
          retention-days: 3
