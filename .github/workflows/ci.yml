name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-rights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rights enforcement (title-only datasets carry titles only)
        run: node scripts/assert-rights.mjs
      - name: Counterpart link integrity
        run: node scripts/check-counterpart-links.mjs
      - name: Production build (vite-ssg, ~26k pages)
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/
          retention-days: 3
