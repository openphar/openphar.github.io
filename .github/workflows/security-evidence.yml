name: security-evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # Official gitleaks_8.30.1_linux_x64.tar.gz digest (from the release checksums file).
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned gitleaks CLI
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/gitleaks"
          mkdir -p "$d"
          curl -sSfL --retry 3 -o "$d/gl.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  $d/gl.tgz" | sha256sum -c -
          tar -xzf "$d/gl.tgz" -C "$d" gitleaks
          "$d/gitleaks" version
          echo "$d" >> "$GITHUB_PATH"
      - name: Scan git history (redacted)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Pull requests: commits introduced by the PR. Push/dispatch: full history.
          if [ "$EVENT" = "pull_request" ]; then
            opts="${BASE_SHA}..${HEAD_SHA}"
          else
            opts="--all"
          fi
          # Exit 1 on any finding. --redact=100 hides values; no verbose output.
          gitleaks git . --no-banner --redact=100 --exit-code 1 \
            --log-opts="$opts" --report-format json --report-path "$RUNNER_TEMP/gl-git.json"
      - name: Scan current checkout (redacted)
        run: |
          set -euo pipefail
          gitleaks dir . --no-banner --redact=100 --exit-code 1 \
            --report-format json --report-path "$RUNNER_TEMP/gl-dir.json"

  sbom-provenance:
    name: sbom-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lock-only CycloneDX SBOM and provenance (no install)
        run: |
          set -euo pipefail
          security_source_sha=$(git rev-parse HEAD)
          out="$RUNNER_TEMP/sbom-out"
          mkdir -p "$out"
          npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type application > "$out/sbom.cdx.json"
          cp package-lock.json "$out/package-lock.json"
          lock_sha=$(sha256sum package-lock.json | cut -d' ' -f1)
          sbom_sha=$(sha256sum "$out/sbom.cdx.json" | cut -d' ' -f1)
          components=$(node -e 'const s=require(process.argv[1]);console.log((s.components||[]).length)' "$out/sbom.cdx.json")
          node -e '
            const [, o, src, lock, sbom, comps, node, npm] = process.argv;
            require("fs").writeFileSync(o, JSON.stringify({
              sourceSha: src, lockfile: "package-lock.json", lockSha256: lock,
              sbom: {file: "sbom.cdx.json", format: "CycloneDX", lockOnly: true, sha256: sbom, components: Number(comps)},
              tools: {node, npm, command: "npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type application"}
            }, null, 2) + "\n");
          ' "$out/provenance.json" "$security_source_sha" "$lock_sha" "$sbom_sha" "$components" "$(node -v)" "$(npm -v)"
          cat "$out/provenance.json"
          echo "SBOM_OUT=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-provenance
          path: |
            ${{ env.SBOM_OUT }}/sbom.cdx.json
            ${{ env.SBOM_OUT }}/package-lock.json
            ${{ env.SBOM_OUT }}/provenance.json
          if-no-files-found: error
